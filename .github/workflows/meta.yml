name: Waffen-Meta wöchentlich aktualisieren

on:
  schedule:
    - cron: "0 14 * * 0"   # jeden Sonntag 14:00 UTC
  workflow_dispatch: {}     # und jederzeit von Hand startbar

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Meta berechnen
        run: python scripts/meta.py
      - name: Änderungen committen
        run: |
          git config user.name "Meta-Roboter"
          git config user.email "actions@users.noreply.github.com"
          git add waffen-meta.json
          git diff --cached --quiet || git commit -m "Waffen-Meta automatisch aktualisiert"
          git push
