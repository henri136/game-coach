name: Matches automatisch zu stat.ink hochladen (s3s)

# Ersetzt den PC: Lädt alle 4 Stunden neue Splatoon-3-Matches und
# Salmon-Run-Schichten von Nintendo zu stat.ink hoch - von dort holt
# sie sich die Coach-App automatisch.
#
# Seit dem Update der Nintendo-Switch-Online-App auf Version 3 (2025) kann
# s3s die Nintendo-Zugangscodes nicht mehr selbst erzeugen (s3s-Issue #198).
# Das übernimmt hier nxapi (github.com/samuelthomas2774/nxapi): Es holt bei
# jedem Lauf mit dem gespeicherten Nintendo-Anmeldeschlüssel frische Codes
# und schreibt sie in die s3s-Einstellungen.
#
# EINRICHTUNG (einmalig, mit Hilfe eines Erwachsenen):
# 1. Auf dem PC "Automatik einrichten.py" starten (liegt im splatoon-Ordner
#    auf dem Desktop) und bei Nintendo anmelden. Danach liegt der Wert für
#    das Secret in der Zwischenablage.
# 2. Auf GitHub: dieses Repository -> Settings -> Secrets and variables
#    -> Actions -> "New repository secret"
#    Name: S3S_AUTOMATIK   |   Inhalt: einfügen (Strg+V)
# 3. Fertig! Ab dann läuft der Upload automatisch alle 4 Stunden.
#    (Zum Testen: Actions-Tab -> diesen Workflow wählen -> "Run workflow")

on:
  schedule:
    - cron: "23 */4 * * *"   # alle 4 Stunden
  workflow_dispatch: {}       # jederzeit von Hand startbar

jobs:
  hochladen:
    runs-on: ubuntu-latest
    steps:
      - name: s3s holen
        uses: actions/checkout@v4
        with:
          repository: frozenpandaman/s3s
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Abhängigkeiten installieren
        run: |
          pip install -q -r requirements.txt
          npm install -g --silent nxapi@next
      - name: Neue Matches hochladen
        env:
          S3S_AUTOMATIK: ${{ secrets.S3S_AUTOMATIK }}
          NXAPI_USER_AGENT: game-coach-s3s/1.0 (+https://github.com/henri136/game-coach)
          NXAPI_SKIP_UPDATE_CHECK: "1"
        run: |
          if [ -z "$S3S_AUTOMATIK" ]; then
            echo "::warning::Kein S3S_AUTOMATIK-Secret gesetzt - Anleitung steht oben in dieser Datei."
            exit 0
          fi
          printf '%s' "$S3S_AUTOMATIK" > config.txt
          NA_TOKEN=$(python -c 'import json; print(json.load(open("config.txt")).get("na_session_token", ""))')
          if [ -z "$NA_TOKEN" ]; then
            echo "::error::Im Secret fehlt der Nintendo-Anmeldeschlüssel - Einrichtung neu machen."
            exit 1
          fi
          echo "::add-mask::$NA_TOKEN"
          # Ausgaben unterdrücken: die Logs dieses öffentlichen Repos sind einsehbar.
          # Fehler aber melden - sonst sieht ein kaputter Lauf aus wie ein erfolgreicher.
          if ! nxapi util update-s3s-token config.txt --token "$NA_TOKEN" > /dev/null 2>&1; then
            echo "::error::Keine frischen Nintendo-Zugangscodes bekommen (nxapi) - evtl. Einrichtung neu machen."
            exit 1
          fi
          if ! timeout 480 python s3s.py -r > /dev/null 2>&1; then
            echo "::error::s3s konnte die Matches nicht hochladen."
            exit 1
          fi
          echo "Durchlauf beendet."
